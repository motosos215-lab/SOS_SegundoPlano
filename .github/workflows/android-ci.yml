name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Compile, Test, Lint and Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Firebase configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s\n' 'GOOGLE_SERVICES_JSON_B64 is not configured' >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          test -s app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit

      - name: Set Gradle permissions
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --console=plain --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --console=plain --no-daemon --no-configuration-cache --max-workers=2

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
